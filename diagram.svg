<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, Menlo, monospace">
  <rect width="1000" height="620" fill="#0f172a"/>

  <!-- Titles -->
  <text x="500" y="35" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="bold">Multi-Site Routed &amp; Switched Network — Packet Tracer Lab</text>

  <!-- Site A -->
  <rect x="30" y="70" width="260" height="200" rx="8" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="160" y="90" text-anchor="middle" fill="#38bdf8" font-size="13">SITE A</text>

  <rect x="90" y="110" width="140" height="30" rx="4" fill="#1e293b" stroke="#94a3b8"/>
  <text x="160" y="130" text-anchor="middle" fill="#f1f5f9" font-size="12">SW-A</text>

  <rect x="30" y="170" width="90" height="26" rx="4" fill="#1e293b" stroke="#64748b"/>
  <text x="75" y="188" text-anchor="middle" fill="#cbd5e1" font-size="10">PC-A1/A2 V10</text>
  <rect x="30" y="220" width="90" height="26" rx="4" fill="#1e293b" stroke="#64748b"/>
  <text x="75" y="238" text-anchor="middle" fill="#cbd5e1" font-size="10">PC-A3/A4 V20</text>
  <rect x="230" y="170" width="30" height="76" rx="4" fill="none" stroke="none"/>

  <rect x="150" y="200" width="80" height="30" rx="4" fill="#1e293b" stroke="#f59e0b"/>
  <text x="190" y="220" text-anchor="middle" fill="#f1f5f9" font-size="11">R1</text>

  <line x1="160" y1="140" x2="160" y2="196" stroke="#64748b" stroke-width="1.5"/>
  <line x1="120" y1="183" x2="150" y2="212" stroke="#64748b" stroke-width="1.5"/>
  <line x1="120" y1="233" x2="150" y2="216" stroke="#64748b" stroke-width="1.5"/>

  <!-- Site B -->
  <rect x="710" y="70" width="260" height="200" rx="8" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="840" y="90" text-anchor="middle" fill="#38bdf8" font-size="13">SITE B</text>

  <rect x="770" y="110" width="140" height="30" rx="4" fill="#1e293b" stroke="#94a3b8"/>
  <text x="840" y="130" text-anchor="middle" fill="#f1f5f9" font-size="12">SW-B</text>

  <rect x="880" y="170" width="90" height="26" rx="4" fill="#1e293b" stroke="#64748b"/>
  <text x="925" y="188" text-anchor="middle" fill="#cbd5e1" font-size="10">PC-B1/B2 V30</text>
  <rect x="880" y="220" width="90" height="26" rx="4" fill="#1e293b" stroke="#64748b"/>
  <text x="925" y="238" text-anchor="middle" fill="#cbd5e1" font-size="10">PC-B3/B4 V40</text>

  <rect x="770" y="200" width="80" height="30" rx="4" fill="#1e293b" stroke="#f59e0b"/>
  <text x="810" y="220" text-anchor="middle" fill="#f1f5f9" font-size="11">R2</text>

  <line x1="840" y1="140" x2="840" y2="196" stroke="#64748b" stroke-width="1.5"/>
  <line x1="880" y1="183" x2="850" y2="212" stroke="#64748b" stroke-width="1.5"/>
  <line x1="880" y1="233" x2="850" y2="216" stroke="#64748b" stroke-width="1.5"/>

  <!-- Core -->
  <rect x="400" y="340" width="200" height="34" rx="4" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="500" y="362" text-anchor="middle" fill="#f1f5f9" font-size="12">SW-CORE (10.0.0.0/29)</text>

  <rect x="440" y="420" width="120" height="30" rx="4" fill="#1e293b" stroke="#64748b"/>
  <text x="500" y="440" text-anchor="middle" fill="#cbd5e1" font-size="11">SRV-DHCP .4</text>
  <line x1="500" y1="374" x2="500" y2="420" stroke="#64748b" stroke-width="1.5"/>

  <rect x="450" y="230" width="80" height="30" rx="4" fill="#1e293b" stroke="#f59e0b"/>
  <text x="490" y="250" text-anchor="middle" fill="#f1f5f9" font-size="11">R3</text>

  <!-- R1/R2/R3 to core -->
  <line x1="190" y1="230" x2="440" y2="352" stroke="#64748b" stroke-width="1.5"/>
  <line x1="810" y1="230" x2="560" y2="352" stroke="#64748b" stroke-width="1.5"/>
  <line x1="490" y1="260" x2="490" y2="340" stroke="#64748b" stroke-width="1.5"/>

  <!-- WAN -->
  <rect x="450" y="500" width="90" height="30" rx="4" fill="#1e293b" stroke="#f43f5e"/>
  <text x="495" y="520" text-anchor="middle" fill="#f1f5f9" font-size="11">R-ISP</text>
  <line x1="490" y1="260" x2="490" y2="500" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="560" y="400" fill="#94a3b8" font-size="10">203.0.113.0/30 (WAN, NAT overload on R3)</text>

  <!-- Legend -->
  <text x="30" y="590" fill="#64748b" font-size="11">V10 10.10.10.0/24 · V20 10.10.20.0/24 · V30 10.20.30.0/24 · V40 10.20.40.0/24</text>
  <text x="30" y="608" fill="#64748b" font-size="11">Trunks: SW-A/SW-B Gi0/1 (802.1Q, native VLAN 99) · Area 0 OSPF on core segment (DR/BDR elected)</text>
</svg>
